name: Sentry issue → Discord

# Sentry 알림 규칙이 GitHub 이슈를 만들면(작성자 sentry[bot]) Discord 채널로 알린다.
# 사람이 만든 이슈는 보내지 않는다. 필요한 시크릿: DISCORD_WEBHOOK_URL (Discord 채널 웹후크 URL)
# issues 이벤트는 기본 브랜치(main)의 워크플로만 실행되므로 머지 후부터 동작한다.

on:
  issues:
    types: [opened]

permissions: {}

jobs:
  notify:
    if: github.event.issue.user.login == 'sentry[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Send Discord message
        uses: actions/github-script@v7
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        with:
          # 이슈 제목·본문은 외부 입력이라 run 셸에 ${{ }} 로 끼워 넣지 않고 payload 에서 읽는다.
          script: |
            const webhookUrl = process.env.DISCORD_WEBHOOK_URL
            if (!webhookUrl) {
              core.setFailed('DISCORD_WEBHOOK_URL 시크릿이 없다')
              return
            }

            const issue = context.payload.issue
            const body = issue.body ?? ''
            const truncate = (text, limit) => (text.length <= limit ? text : `${text.slice(0, limit - 1)}…`)

            // 본문 첫 줄: "Sentry Issue: [JAVASCRIPT-NEXTJS-5](https://peakda.sentry.io/issues/152504364/)"
            const sentryUrl = body.match(/https:\/\/[^\s)]*sentry\.io\/[^\s)]*issues\/\d+\/?/)?.[0]
            // 실제 에러 이슈는 본문에 예외 메시지·스택을 코드 블록으로 담는다 (테스트 이슈에는 없다).
            const summary = (body.match(/```[^\n]*\n([\s\S]*?)```/)?.[1] ?? '').trim()
            const labels = issue.labels.map((label) => label.name).join(', ')
            const time = new Intl.DateTimeFormat('sv-SE', {
              timeZone: 'Asia/Seoul',
              dateStyle: 'short',
              timeStyle: 'short',
            }).format(new Date(issue.created_at))

            const lines = [
              '🚨 **Sentry Error Alert**',
              '',
              '**Service:** Peakda',
              `**Title:** ${truncate(issue.title, 200)}`,
              `**Time:** ${time} KST`,
              // <> 로 감싸면 링크 미리보기 카드가 붙지 않는다.
              `**Sentry:** ${sentryUrl ? `<${sentryUrl}>` : '(링크 없음)'}`,
              `**GitHub:** <${issue.html_url}>`,
            ]
            if (labels) lines.push(`**Labels:** ${labels}`)
            if (summary) {
              // 요약 속 ``` 가 코드 블록을 닫지 않게 바꾸고, Discord 2000자 제한 안에 들어가게 자른다.
              lines.push('', '**Summary:**', '```', truncate(summary.replace(/```/g, "'''"), 800), '```')
            }

            const payload = {
              content: lines.join('\n'),
              // 에러 메시지 속 @everyone 같은 문자열이 멘션으로 울리지 않게 막는다.
              allowed_mentions: { parse: [] },
            }

            // 429·5xx 는 잠시 뒤 다시 보내고, 그 밖의 실패(웹훅 삭제 등)는 바로 실패 처리한다.
            for (let attempt = 1; attempt <= 3; attempt++) {
              const res = await fetch(webhookUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload),
              })
              if (res.ok) return
              // Discord 에러 본문만 남긴다. 웹훅 URL 은 로그에 쓰지 않는다.
              core.warning(`Discord 응답 ${res.status}: ${(await res.text()).slice(0, 300)}`)
              if (res.status !== 429 && res.status < 500) break
              await new Promise((resolve) => setTimeout(resolve, attempt * 2000))
            }
            core.setFailed('Discord 전송 실패')
